name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, typechecks, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run check-only lint
        run: npm run lint:check

      - name: Validate Expo configuration
        run: npm run validate:mobile

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run API tests
        run: npx nx run api:test --outputStyle=static

      - name: Run mobile tests with coverage
        run: npm run test:coverage

      - name: Enforce mobile coverage threshold
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(
            fs.readFileSync('apps/mobile/coverage/coverage-summary.json', 'utf8'),
          ).total;
          const required = 90;
          const metrics = ['branches', 'functions', 'lines', 'statements'];
          const failures = metrics.filter((metric) => {
            const percentage = Number(summary[metric].pct);
            return !Number.isFinite(percentage) || percentage < required;
          });
          for (const metric of metrics) {
            console.log(`${metric}: ${summary[metric].pct}%`);
          }
          if (failures.length > 0) {
            console.error(`Coverage is below ${required}% for: ${failures.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Publish coverage statement
        run: |
          cat apps/mobile/coverage/coverage-summary.json
          {
            echo '## Mobile Jest coverage'
            echo '```json'
            cat apps/mobile/coverage/coverage-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mobile coverage
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage
          if-no-files-found: error

      - name: Run typechecks
        run: npm run typecheck -- --outputStyle=static

      - name: Build Node services
        run: npm run build -- --outputStyle=static
